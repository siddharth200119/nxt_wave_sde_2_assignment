      value: application/json
  body:
    type: json
    data: |-
      {
        "organization_id": "60e8b741-b9be-4445-b163-0e0ec886e90f",
        "email": "admin@backroombuilds.com",
        "password": "password",
        "role": "ADMIN"
      }
